name: Userfetch

on:
  push:
    branches:
      - main # Or your default branch
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14"

      - name: Install Dependencies
        run: npm install

      - name: Run Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node userfetch.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          # Check if README.md or pokemon.svg has been modified
          if git diff --quiet HEAD -- README.md pokemon.svg; then
            echo "No changes to README.md or pokemon.svg, skipping commit"
          else
            echo "Changes detected in README.md or pokemon.svg, committing..."
            git add README.md pokemon.svg
            git commit -m 'Update README with latest stats'
            git push
          fi
